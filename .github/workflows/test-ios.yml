name: Test VisionClaw iOS

on:
  workflow_dispatch:
  push:
    branches:
      - ios-direct-gemini

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: samples/CameraAccess
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: cp CameraAccess/Secrets.swift.example CameraAccess/Secrets.swift
      - name: Run configuration tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
            -only-testing:CameraAccessTests/VisionClawConfigurationTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify first-launch accessibility semantics
        run: |
          set -euo pipefail
          grep -q 'accessibilityLabel("Settings")' CameraAccess/Views/StreamView.swift
          grep -q 'accessibilityLabel("Capture photo")' CameraAccess/Views/StreamView.swift
          grep -q '"End call" : "Start call"' CameraAccess/Views/StreamView.swift
          grep -q 'A11y.announce("Gemini ready")' CameraAccess/Gemini/GeminiSessionViewModel.swift
          grep -q 'A11y.announce("Gemini connection lost", assertive: true)' CameraAccess/Gemini/GeminiSessionViewModel.swift
          grep -q 'Open Settings and enter it under Gemini API' CameraAccess/Views/StreamSessionView.swift
