name: Test VisionClaw iOS

on:
  workflow_dispatch:
  push:
    branches:
      - ios-direct-gemini

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: samples/CameraAccess
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: cp CameraAccess/Secrets.swift.example CameraAccess/Secrets.swift
      - name: Verify configuration safety contract
        run: |
          set -euo pipefail
          test "$(grep -R --include='*.swift' -nE 'AIza[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z_-]{20,}' CameraAccess CameraAccessTests | wc -l | tr -d ' ')" = "0"
          grep -q 'var modelPath: String { "models/gemini-3.8-live" }' CameraAccess/Settings/SettingsManager.swift
          grep -q 'func testDirectModeToolDeclarationsDoNotAdvertiseUnavailableAgent' CameraAccessTests/VisionClawConfigurationTests.swift
          grep -q 'func testUnauthorizedGatewayIsNotConnected' CameraAccessTests/VisionClawConfigurationTests.swift
          grep -q 'func testCancelledStartupGenerationCannotResume' CameraAccessTests/VisionClawConfigurationTests.swift
          grep -q 'func testSecureStoreRoundTrip' CameraAccessTests/VisionClawConfigurationTests.swift
          grep -q 'kSecClassGenericPassword' CameraAccess/iPhone/SecureStore.swift
          grep -q 'secureStore.set(value' CameraAccess/Settings/SettingsManager.swift
          grep -q 'func testAssistivePromptPrioritizesBlindUserSafety' CameraAccessTests/VisionClawConfigurationTests.swift

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
            -only-testing:CameraAccessTests/VisionClawConfigurationTests \
            -skip-testing:CameraAccessTests/VisionClawConfigurationTests/testSecureStoreRoundTrip \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify first-launch accessibility semantics
        run: |
          set -euo pipefail
          grep -q 'accessibilityLabel("Settings")' CameraAccess/Views/StreamView.swift
          grep -q 'accessibilityLabel("Capture photo")' CameraAccess/Views/StreamView.swift
          grep -q '"End call" : "Start call"' CameraAccess/Views/StreamView.swift
          grep -q 'A11y.announce("Gemini ready")' CameraAccess/Gemini/GeminiSessionViewModel.swift
          grep -q 'A11y.announce("Gemini connection lost", assertive: true)' CameraAccess/Gemini/GeminiSessionViewModel.swift
          grep -q 'Open Settings and enter it under Gemini API' CameraAccess/Views/StreamSessionView.swift
